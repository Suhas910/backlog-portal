# Test profile — points the context test at a LOCAL throwaway Postgres, never prod.
# Explicit literal datasource so neither the Neon default nor a .env can redirect it.
# Everything else (Flyway on, ddl-auto=validate) is inherited from application.properties.
spring.datasource.url=jdbc:postgresql://localhost:5433/backlog
spring.datasource.username=verify
spring.datasource.password=verify
# fresh empty DB -> Flyway just runs V1 (no baseline needed)
spring.flyway.baseline-on-migrate=false
